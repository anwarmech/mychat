<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Chat</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17312d;background:#e9f2ef}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 24px #1232}header{background:#08796c;color:#fff;padding:17px 20px;display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0}.status{font-size:12px;opacity:.9;margin-top:4px}button{border:0;border-radius:11px;background:#08796c;color:#fff;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.subtle{background:#e4f3ee;color:#08796c}main{flex:1;min-height:0;display:flex;flex-direction:column}.join{padding:20px;overflow:auto}.panel{max-width:430px;margin:25px auto;padding:24px;border:1px solid #d8e6e1;border-radius:20px}.panel h2{margin-top:0}.panel p{color:#526a64;line-height:1.5}label{display:block;font-weight:650;margin:18px 0 8px}input,textarea{font:inherit;border:1px solid #bed3cd;border-radius:11px;padding:13px;width:100%;outline:0}input:focus,textarea:focus{border-color:#08796c;box-shadow:0 0 0 3px #08796c18}.code{font-size:28px;letter-spacing:8px;text-align:center;font-weight:700}.wide{width:100%;margin-top:16px}.error{color:#b42318!important;font-size:13px;white-space:pre-wrap}.small{font-size:12px!important}.hidden{display:none!important}.chat{flex:1;min-height:0;display:flex;flex-direction:column}.bar{padding:11px 15px;display:flex;align-items:center;justify-content:space-between;background:#f7faf9;border-bottom:1px solid #e1e9e6;gap:8px}.room{font-weight:700}.messages{background:#edf4f1;flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:83%;align-self:flex-start;background:#fff;border-radius:15px;padding:10px 13px;box-shadow:0 1px 3px #0001;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#d6f4e6}.sender{font-size:11px;font-weight:700;color:#08796c;margin-bottom:5px}.body{white-space:pre-wrap;line-height:1.4}.time{font-size:10px;color:#647c74;text-align:right;margin-top:5px}.send{padding:11px;display:flex;gap:8px;align-items:flex-end}.send textarea{resize:none;max-height:110px}.send button{align-self:stretch}.empty{margin:auto;color:#6d807a;text-align:center;padding:25px}#leave{background:#ffffff2b}@media(max-width:500px){.panel{margin:5px auto;padding:18px}.join{padding:12px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>💬 My Chat</h1><div id="status" class="status">Connecting to Firebase…</div></div><button id="leave" class="hidden">Change room</button></header>
<main>
<section id="join" class="join"><div class="panel">
<h2>Welcome 👋</h2><p>Enter the same 4-digit code on both devices to open your shared conversation.</p>
<label for="roomCode">4-digit room code</label><input id="roomCode" class="code" type="text" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="0000">
<div id="nameBox" class="hidden"><label for="name">Your name (first visit only)</label><input id="name" maxlength="30" autocomplete="nickname" placeholder="Enter your name"></div>
<button id="joinBtn" class="wide" disabled>Enter chat</button>
<p id="error" class="error" role="alert"></p>
<p class="small">Your name is saved on this device for each room. A 4-digit code is easy to guess; don't use this chat for sensitive information.</p>
</div></section>
<section id="chat" class="chat hidden"><div class="bar"><span id="roomLabel" class="room"></span><button id="copy" class="subtle">Copy room code</button></div><div id="messages" class="messages" role="log" aria-live="polite"></div><form id="send" class="send"><textarea id="message" rows="1" maxlength="2000" placeholder="Type a message…" aria-label="Message"></textarea><button id="sendBtn" type="submit">Send</button></form></section>
</main></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
'use strict';
const firebaseConfig = {
  apiKey: "AIzaSyAKRXwR-lCCefNlz6EjkERGSt5QvdMEAMg",
  authDomain: "my-chat-975d4.firebaseapp.com",
  databaseURL: "https://my-chat-975d4-default-rtdb.firebaseio.com",
  projectId: "my-chat-975d4",
  storageBucket: "my-chat-975d4.firebasestorage.app",
  messagingSenderId: "315552068220",
  appId: "1:315552068220:web:379e1962cdfc725ad84ff9"
};
const $=id=>document.getElementById(id);
let db,uid=null,roomCode='',roomRef=null,onMessage=null,roomQuery=null,activeName='';
const validCode=c=>/^\d{4}$/.test(c);
// Fixed reversible encoding: each digit's ASCII hex (30..39) repeated 6 times = 48 hex chars.
// The SAME 4-digit code always gives the SAME Firebase room ID.
// This is an encoding, NOT encryption; anyone can guess 4-digit rooms.
function firebaseRoomId(code){const chunk=Array.from(code,c=>c.charCodeAt(0).toString(16)).join('');return chunk.repeat(6)}
const storageKey=c=>'mychat-name-v2-'+c;
function getSavedName(c){try{return localStorage.getItem(storageKey(c))||''}catch(e){return ''}}
function saveName(c,n){try{localStorage.setItem(storageKey(c),n)}catch(e){}}
function setError(s){$('error').textContent=s}
function updateNameBox(){const c=$('roomCode').value;const show=validCode(c)&&!getSavedName(c);$('nameBox').classList.toggle('hidden',!show);if(!show)$('name').value='';setError('')}
$('roomCode').addEventListener('input',()=>{$('roomCode').value=$('roomCode').value.replace(/\D/g,'').slice(0,4);updateNameBox()});
$('roomCode').addEventListener('keydown',e=>{if(e.key==='Enter'){$('joinBtn').click()}});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter'){$('joinBtn').click()}});
$('joinBtn').addEventListener('click',()=>{
  if(!uid)return setError('Firebase is still connecting. Please wait.');
  const code=$('roomCode').value;if(!validCode(code))return setError('Enter exactly 4 digits.');
  const name=(getSavedName(code)||$('name').value.trim()).slice(0,30);
  if(!name)return setError('Enter your name for this room.');
  saveName(code,name);openRoom(code,name);
});
function clearListener(){if(roomQuery&&onMessage){roomQuery.off('child_added',onMessage)}roomQuery=null;onMessage=null;roomRef=null}
function openRoom(code,name){
  clearListener();roomCode=code;activeName=name;setError('');
  $('join').classList.add('hidden');$('chat').classList.remove('hidden');$('leave').classList.remove('hidden');
  $('roomLabel').textContent='Room '+code+' · '+name;$('messages').replaceChildren();
  $('status').textContent='Connected as '+name;
  roomRef=db.ref('rooms/'+firebaseRoomId(code)+'/messages');
  roomQuery=roomRef.limitToLast(150);
  const empty=document.createElement('div');empty.className='empty';empty.textContent='No messages yet. Say hello 👋';$('messages').append(empty);
  onMessage=snap=>{
    const m=snap.val();if(!m||typeof m.text!=='string')return;
    if(empty.isConnected)empty.remove();
    const b=document.createElement('div');b.className='bubble'+(m.uid===uid?' mine':'');
    const sender=document.createElement('div');sender.className='sender';sender.textContent=typeof m.name==='string'?m.name:'Guest';
    const body=document.createElement('div');body.className='body';body.textContent=m.text;
    const time=document.createElement('div');time.className='time';time.textContent=typeof m.ts==='number'?new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Sending…';
    b.append(sender,body,time);$('messages').append(b);$('messages').scrollTop=$('messages').scrollHeight;
  };
  roomQuery.on('child_added',onMessage,error=>{$('status').textContent='Database error';alert('Unable to load chat: '+error.message)});
  $('message').focus();
}
$('leave').addEventListener('click',()=>{clearListener();roomCode='';$('chat').classList.add('hidden');$('join').classList.remove('hidden');$('leave').classList.add('hidden');$('status').textContent='Connected';updateNameBox()});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(roomCode);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy room code',1500)}catch(e){prompt('Copy room code:',roomCode)}});
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').requestSubmit()}});
$('send').addEventListener('submit',async e=>{
  e.preventDefault();const text=$('message').value.trim();if(!text||!roomRef||!uid)return;
  $('sendBtn').disabled=true;
  try{await roomRef.push({uid,name:activeName,text,ts:firebase.database.ServerValue.TIMESTAMP});$('message').value='';$('message').focus()}
  catch(err){alert('Message not sent: '+err.message)}finally{$('sendBtn').disabled=false}
});
(async()=>{
 try{
  firebase.initializeApp(firebaseConfig);db=firebase.database();
  const result=await firebase.auth().signInAnonymously();uid=result.user.uid;
  $('status').textContent='Connected';$('joinBtn').disabled=false;
  updateNameBox();
 }catch(err){$('status').textContent='Connection failed';setError((err.code||'Firebase error')+': '+err.message);$('joinBtn').disabled=true;console.error(err)}
})();
</script>
</body></html>
